# One customer's web address. The same frontend build is shared by every
# customer (built with no VITE_API_BASE_URL, so it calls /api on its own
# address); /api goes to that customer's backend port.
server {
    listen 80;
    server_name __DOMAIN__;

    root /srv/icrm/app/frontend/dist;
    index index.html;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
